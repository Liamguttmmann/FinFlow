<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinFlow - Gastos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar__brand">FF</div>
      <nav class="sidebar__nav">
        <button class="sidebar__nav-item active" aria-label="Gastos">
          <span class="material-symbols">payments</span>
        </button>
        <button class="sidebar__nav-item" aria-label="Investimentos">
          <span class="material-symbols">trending_up</span>
        </button>
        <button class="sidebar__nav-item" aria-label="Metas">
          <span class="material-symbols">flag</span>
        </button>
        <button class="sidebar__nav-item" aria-label="Configurações">
          <span class="material-symbols">settings</span>
        </button>
      </nav>
    </aside>

    <main class="main">
      <header class="main__header">
        <p class="header__subtitle">Resumo com base na triagem</p>
        <p class="header__greeting">Olá, bom te ver de novo 👋</p>
        <h1 class="header__title">Gastos</h1>
      </header>

      <section class="gastos">
        <div class="gastos__top">
          <div class="gastos__tabs" role="tablist">
            <button class="tab-button active" data-tab="overview" role="tab" aria-selected="true">Visão Geral</button>
            <button class="tab-button" data-tab="weekly" role="tab" aria-selected="false">Semanal</button>
            <button class="tab-button" data-tab="monthly" role="tab" aria-selected="false">Mensal</button>
          </div>
          <button id="btnAddGasto" class="btn btn--primary">Adicionar gasto</button>
        </div>

        <div class="gastos__content">
          <div class="gastos__chart-card">
            <canvas id="gastos-chart" aria-label="Distribuição de gastos" role="img" height="320"></canvas>
            <div id="gastos-chart-legend" class="gastos__chart-legend"></div>
          </div>
          <div id="gastos-lista-container" class="gastos__lista" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="gasto-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal__overlay" data-close></div>
    <div class="modal__content">
      <header class="modal__header">
        <h2>Registrar novo gasto</h2>
        <button class="modal__close" type="button" aria-label="Fechar" data-close>&times;</button>
      </header>
      <form id="gasto-form" class="modal__form">
        <div class="form__group">
          <label for="gasto-tipo">Tipo de gasto *</label>
          <select id="gasto-tipo" required>
            <option value="">Selecione</option>
            <option value="Fixo">Fixo</option>
            <option value="Assinatura">Assinatura</option>
            <option value="Variável">Variável</option>
          </select>
        </div>

        <div class="form__group">
          <label for="gasto-categoria">Categoria *</label>
          <select id="gasto-categoria" required>
            <option value="">Selecione</option>
            <option value="Moradia/Aluguel">Moradia/Aluguel</option>
            <option value="Telefone/Internet">Telefone/Internet</option>
            <option value="Transporte">Transporte</option>
            <option value="Mercado">Mercado</option>
            <option value="Lazer">Lazer</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <div class="form__group form__group--conditional" id="subcategoria-group">
          <label for="gasto-subcategoria">Subcategoria / detalhe</label>
          <select id="gasto-subcategoria">
            <option value="">Não se aplica</option>
          </select>
        </div>

        <div class="form__group">
          <label for="gasto-etiqueta">Etiqueta</label>
          <input type="text" id="gasto-etiqueta" placeholder="Ex: Trabalho" />
        </div>

        <div class="form__group">
          <label for="gasto-descricao">Descrição *</label>
          <input type="text" id="gasto-descricao" required placeholder="Aluguel apto 45" />
        </div>

        <div class="form__group">
          <label for="gasto-valor">Valor *</label>
          <input type="number" id="gasto-valor" min="0" step="0.01" required placeholder="0,00" />
        </div>

        <div class="form__group">
          <label for="gasto-data">Data *</label>
          <input type="date" id="gasto-data" required />
        </div>

        <footer class="modal__footer">
          <button type="button" class="btn btn--ghost" data-close>Cancelar</button>
          <button type="submit" class="btn btn--primary">Salvar gasto</button>
        </footer>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="scripts/gastos.js" defer></script>
</body>
</html>
